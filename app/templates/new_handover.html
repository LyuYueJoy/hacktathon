{% extends "base.html" %}
{% block title %}New Handover{% endblock %}
{% block content %}
<div class="home-page">
    <section class="tasks-section handover-form-card">
        <div class="tasks-header"><div><p class="form-eyebrow">Nurse Handover</p><h2>New Handover</h2><p class="form-subtitle">Capture the changes, risks and follow-ups for the next nurse.</p></div></div>
        <form method="POST" action="{{ url_for('handover.new_handover') }}">
            <div class="handover-fields-row">
                <p><label for="room">Room</label><input id="room" name="room" placeholder="Room 12" required></p>
                <p><label for="patient">Patient</label><input id="patient" name="patient" placeholder="Jane" required></p>
                <p><label for="age">Age</label><input id="age" name="age" type="number" min="0" max="120" placeholder="67" required></p>
            </div>
            <p><label for="changed">What changed this shift?</label><textarea id="changed" name="changed" rows="4" required></textarea></p>
            <p><label for="watch_out">Watch out for</label><textarea id="watch_out" name="watch_out" rows="3"></textarea></p>
            <p><label for="waiting_on">Waiting on</label><textarea id="waiting_on" name="waiting_on" rows="3"></textarea></p>
            <p><label for="next_nurse">Next nurse should know</label><textarea id="next_nurse" name="next_nurse" rows="4" required></textarea></p>
            <p><label for="previous_notes">Notes from previous shift</label><textarea id="previous_notes" name="previous_notes" rows="3"></textarea></p>
            <p><label for="urgency">Importance</label><input type="range" id="urgency" name="urgency" min="0" max="10" value="5" oninput="document.getElementById('urgencyVal').innerText = this.value"><span id="urgencyVal">5</span> <small>0 = routine · 10 = urgent</small></p>
            <button type="submit">Generate Handover</button>
        </form>
    </section>
</div>
{% endblock %}
