<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Nurse Handover{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/handover.css') }}">
    {% block styles %}{% endblock %}
</head>
<body>
    <div class="handover-shell">
        <header class="site-header">
            <a class="brand" href="{{ url_for('home.home') }}">Nurse Handover</a>
            <nav aria-label="Main navigation">
                <a class="nav-item {% if request.path == url_for('home.home') %}active{% endif %}" href="{{ url_for('home.home') }}">Home</a>
                <a class="nav-item {% if request.path == url_for('handover.new_handover') %}active{% endif %}" href="{{ url_for('handover.new_handover') }}">New Handover</a>
            </nav>
        </header>
        <main class="page-content">{% block content %}{% endblock %}</main>
    </div>
</body>
</html>
