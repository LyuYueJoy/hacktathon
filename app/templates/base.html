<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nurse Handover{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block styles %}{% endblock %}
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="brand"><div class="brand-mark">N</div><div class="project-name">Nurse Handover</div></div>
        <nav class="nav-menu" aria-label="Main navigation">
            <a href="{{ url_for('home.home') }}" class="nav-link {% if request.path == url_for('home.home') %}active{% endif %}">Home</a>
            <a href="{{ url_for('handover.new_handover') }}" class="nav-link {% if request.path == url_for('handover.new_handover') %}active{% endif %}">New Handover</a>
        </nav>
    </aside>
    <div class="main-shell">
        <header class="topbar"><div class="search-wrap"><span class="search-icon">⌕</span><input type="search" placeholder="Search handovers" aria-label="Search handovers"></div></header>
        <main class="main-content">{% block content %}{% endblock %}</main>
    </div>
</div>
</body>
</html>
