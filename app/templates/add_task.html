{% extends "base.html" %}
{% block content %}
<h2>Add Task</h2>
<form method="POST" action="{{ url_for('task.add_task') }}">
    <p>
        <label for="name">Name</label><br>
        <input type="text" id="name" name="name" required>
    </p>
    <p>
        <label for="description">Description</label><br>
        <textarea id="description" name="description" required></textarea>
    </p>
    <p>
        <label for="location">Location / Ward</label><br>
        <input type="text" id="location" name="location" required>
    </p>
    <p>
        <label for="assigned_to">Assign To</label><br>
        <select id="assigned_to" name="assigned_to">
            {% for assignee in assignees %}
            <option value="{{ assignee }}">{{ assignee }}</option>
            {% endfor %}
        </select>
    </p>
    <p>
        <label for="notes">Additional Notes</label><br>
        <textarea id="notes" name="notes"></textarea>
    </p>
    <p>
        <label for="urgency">Urgency</label><br>
        <input type="range" id="urgency" name="urgency" min="1" max="10" value="5"
               oninput="document.getElementById('urgencyVal').innerText = this.value">
        <span id="urgencyVal">5</span>
    </p>
    <button type="submit">Submit</button>
</form>
{% endblock %}
